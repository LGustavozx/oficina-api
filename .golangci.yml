version: "2"

linters:
  enable:
    - gosec
    - errorlint
    - bodyclose
  # misspell fica de fora: verifica inglês e erra nos comentários em português.
  exclusions:
    rules:
      # Senhas de exemplo nos testes disparam G101 (credencial fixa).
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
